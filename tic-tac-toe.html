<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three in a Row</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1a1030;
    --bg-deep2:#2a1550;
    --pink:#ff3d81;
    --purple:#9b5cff;
    --orange:#ffab3d;
    --teal:#2ee6c6;
    --cream:#fff6ea;
    --muted:#b6a8d9;
    --font-display: 'Baloo 2', system-ui, sans-serif;
    --font-mono: 'Space Mono', 'SFMono-Regular', Consolas, monospace;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,61,129,0.28), transparent 42%),
      radial-gradient(circle at 85% 20%, rgba(155,92,255,0.30), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(46,230,198,0.18), transparent 50%),
      linear-gradient(160deg, var(--bg-deep), var(--bg-deep2));
    font-family: var(--font-mono);
    color: var(--cream);
    padding: 24px;
  }

  .board-shell{
    width: min(430px, 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 22px;
  }

  .masthead{ text-align:center; }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color: var(--muted);
    margin:0 0 8px;
  }

  h1{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 42px;
    margin: 0;
    letter-spacing: 0.01em;
    background: linear-gradient(100deg, var(--pink) 10%, var(--purple) 55%, var(--teal) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 18px rgba(255,61,129,0.25));
  }

  .status{
    min-height: 30px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--cream);
    display:flex;
    align-items:center;
    gap: 9px;
  }

  .status .turn-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:24px; height:24px;
    border-radius:8px;
    font-weight:800;
    font-family: var(--font-display);
    font-size: 14px;
  }
  .turn-mark.x{ color:#fff; background: linear-gradient(135deg, var(--pink), var(--orange)); box-shadow: 0 0 14px rgba(255,61,129,0.55); }
  .turn-mark.o{ color:#fff; background: linear-gradient(135deg, var(--teal), var(--purple)); box-shadow: 0 0 14px rgba(46,230,198,0.5); }

  .grid-wrap{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .grid{
    position: relative;
    width: 100%;
    height: 100%;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: rgba(255,246,234,0.03);
    border-radius: 20px;
    padding: 10px;
    gap: 10px;
    box-shadow:
      0 25px 60px -20px rgba(0,0,0,0.55),
      inset 0 0 0 1.5px rgba(255,255,255,0.08);
    backdrop-filter: blur(2px);
  }

  .cell{
    position:relative;
    background: rgba(255,246,234,0.05);
    border: 1.5px solid rgba(255,246,234,0.09);
    border-radius: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .cell:hover:not(.filled){
    background: rgba(255,246,234,0.1);
    border-color: rgba(255,246,234,0.22);
  }
  .cell:active:not(.filled){ transform: scale(0.96); }
  .cell:focus-visible{
    outline: 2px solid var(--orange);
    outline-offset: 2px;
  }

  .mark{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: min(16vw, 68px);
    line-height: 1;
    opacity: 0;
    transform: scale(0.4) rotate(-10deg);
    transition: opacity 0.22s cubic-bezier(.34,1.56,.64,1), transform 0.32s cubic-bezier(.34,1.56,.64,1);
  }
  .mark.show{ opacity: 1; transform: scale(1) rotate(0deg); }

  .mark.x{
    background: linear-gradient(135deg, var(--pink), var(--orange));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,61,129,0.35));
  }
  .mark.o{
    background: linear-gradient(135deg, var(--teal), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(46,230,198,0.35));
  }

  .cell.winning{
    background: rgba(255,246,234,0.12);
    border-color: rgba(255,246,234,0.3);
    animation: pulse 0.7s ease-in-out infinite alternate;
  }
  @keyframes pulse{
    from{ transform: scale(1); }
    to{ transform: scale(1.04); }
  }

  .winline{
    position:absolute;
    top:10px; left:10px;
    width:calc(100% - 20px); height:calc(100% - 20px);
    pointer-events:none;
  }
  .winline line{
    stroke: var(--cream);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    transition: stroke-dashoffset 0.4s cubic-bezier(.34,1.2,.64,1) 0.05s;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
  }
  .winline line.draw{ stroke-dashoffset: 0; }

  .scoreboard{
    display:flex;
    width:100%;
    justify-content:space-between;
    gap: 10px;
  }
  .score{
    flex:1;
    border-radius: 12px;
    padding: 12px 8px;
    text-align:center;
    border: 1.5px solid rgba(255,246,234,0.1);
  }
  .score.x{ background: linear-gradient(160deg, rgba(255,61,129,0.16), rgba(255,171,61,0.08)); }
  .score.o{ background: linear-gradient(160deg, rgba(46,230,198,0.16), rgba(155,92,255,0.1)); }
  .score.draws{ background: rgba(255,246,234,0.05); }

  .score .label{
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .score .value{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 24px;
  }
  .score.x .value{ color: var(--pink); }
  .score.o .value{ color: var(--teal); }
  .score.draws .value{ color: var(--cream); }

  .controls{
    display:flex;
    gap: 10px;
    width: 100%;
  }
  button.action{
    flex:1;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(255,246,234,0.06);
    color: var(--cream);
    border: 1.5px solid rgba(255,246,234,0.16);
    border-radius: 10px;
    padding: 12px 12px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  button.action:hover{
    background: rgba(255,246,234,0.12);
    border-color: rgba(255,246,234,0.35);
  }
  button.action:active{ transform: scale(0.97); }
  button.action:focus-visible{
    outline: 2px solid var(--orange);
    outline-offset: 2px;
  }
  button.action.reset-match{
    color: var(--pink);
    border-color: rgba(255,61,129,0.35);
    background: rgba(255,61,129,0.08);
  }
  button.action.reset-match:hover{
    background: rgba(255,61,129,0.16);
  }

  @media (prefers-reduced-motion: reduce){
    .mark, .winline line, .cell.winning{ transition: none; animation: none; }
  }
</style>
</head>
<body>

<div class="board-shell">
  <div class="masthead">
    <p class="eyebrow">Local Two-Player</p>
    <h1>Three in a Row</h1>
  </div>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="grid-wrap">
    <div class="grid" id="grid" role="grid" aria-label="Tic tac toe board"></div>
    <svg class="winline" id="winline" viewBox="0 0 280 280"><line id="winlineEl" x1="0" y1="0" x2="0" y2="0"/></svg>
  </div>

  <div class="scoreboard">
    <div class="score x">
      <div class="label">X wins</div>
      <div class="value" id="scoreX">0</div>
    </div>
    <div class="score draws">
      <div class="label">Draws</div>
      <div class="value" id="scoreD">0</div>
    </div>
    <div class="score o">
      <div class="label">O wins</div>
      <div class="value" id="scoreO">0</div>
    </div>
  </div>

  <div class="controls">
    <button class="action" id="newRound">New Round</button>
    <button class="action reset-match" id="resetMatch">Reset Match</button>
  </div>
</div>

<script>
(function(){
  const gridEl = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const winlineEl = document.getElementById('winlineEl');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const scoreDEl = document.getElementById('scoreD');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const LINE_COORDS = {
    '0,1,2': [20,46, 260,46],
    '3,4,5': [20,140, 260,140],
    '6,7,8': [20,234, 260,234],
    '0,3,6': [46,20, 46,260],
    '1,4,7': [140,20, 140,260],
    '2,5,8': [234,20, 234,260],
    '0,4,8': [28,28, 252,252],
    '2,4,6': [252,28, 28,252]
  };

  let board = Array(9).fill(null);
  let current = 'X';
  let active = true;
  let scores = { X:0, O:0, D:0 };

  const cells = [];

  function buildGrid(){
    gridEl.innerHTML = '';
    cells.length = 0;
    for(let i=0;i<9;i++){
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.setAttribute('role','gridcell');
      btn.setAttribute('aria-label', 'Cell ' + (i+1));
      btn.dataset.index = i;
      const mark = document.createElement('span');
      mark.className = 'mark';
      btn.appendChild(mark);
      btn.addEventListener('click', onCellClick);
      gridEl.appendChild(btn);
      cells.push(btn);
    }
  }

  function onCellClick(e){
    const i = parseInt(e.currentTarget.dataset.index, 10);
    if(!active || board[i]) return;
    place(i, current);
    const win = checkWin();
    if(win){
      finishRound(win);
    } else if(board.every(v => v)){
      finishRound(null, true);
    } else {
      current = current === 'X' ? 'O' : 'X';
      updateStatus();
    }
  }

  function place(i, mark){
    board[i] = mark;
    const cellEl = cells[i];
    cellEl.classList.add('filled');
    const markEl = cellEl.querySelector('.mark');
    markEl.textContent = mark;
    markEl.classList.add(mark.toLowerCase());
    requestAnimationFrame(() => markEl.classList.add('show'));
  }

  function checkWin(){
    for(const line of WIN_LINES){
      const [a,b,c] = line;
      if(board[a] && board[a] === board[b] && board[a] === board[c]){
        return line;
      }
    }
    return null;
  }

  function finishRound(winLine, isDraw){
    active = false;
    if(winLine){
      scores[current] += 1;
      winLine.forEach(i => cells[i].classList.add('winning'));
      drawWinLine(winLine);
      statusEl.innerHTML = `<span class="turn-mark ${current.toLowerCase()}">${current}</span><span>takes the round!</span>`;
    } else if(isDraw){
      scores.D += 1;
      statusEl.innerHTML = `<span>Stalemate — board's full</span>`;
    }
    updateScoreboard();
  }

  function drawWinLine(line){
    const key = line.join(',');
    const coords = LINE_COORDS[key];
    if(!coords) return;
    const [x1,y1,x2,y2] = coords;
    winlineEl.setAttribute('x1', x1);
    winlineEl.setAttribute('y1', y1);
    winlineEl.setAttribute('x2', x2);
    winlineEl.setAttribute('y2', y2);
    requestAnimationFrame(() => winlineEl.classList.add('draw'));
  }

  function updateStatus(){
    statusEl.innerHTML = `<span class="turn-mark ${current.toLowerCase()}">${current}</span><span>to move</span>`;
  }

  function updateScoreboard(){
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
    scoreDEl.textContent = scores.D;
  }

  function newRound(){
    board = Array(9).fill(null);
    current = current === 'X' ? 'O' : 'X';
    active = true;
    winlineEl.classList.remove('draw');
    buildGrid();
    updateStatus();
  }

  function resetMatch(){
    scores = { X:0, O:0, D:0 };
    updateScoreboard();
    current = 'X';
    board = Array(9).fill(null);
    active = true;
    winlineEl.classList.remove('draw');
    buildGrid();
    updateStatus();
  }

  document.getElementById('newRound').addEventListener('click', newRound);
  document.getElementById('resetMatch').addEventListener('click', resetMatch);

  buildGrid();
  updateStatus();
  updateScoreboard();
})();
</script>

</body>
</html>
